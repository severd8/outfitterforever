name: Bug report
description: Something in Outfitter Forever isn't working
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The more detail you give, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: The steps that lead to the problem.
      placeholder: |
        1. Made an outfit with my fishing pole and hat
        2. Gave it the Fishing script
        3. ...
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Your class
      options: [Druid, Hunter, Mage, Paladin, Priest, Rogue, Shaman, Warlock, Warrior]
    validations:
      required: true
  - type: input
    id: outfit
    attributes:
      label: Which outfit or script?
      description: The outfit, automatic outfit or script involved (if any).
      placeholder: Riding, Fishing, Defensive Stance, my own script...
  - type: dropdown
    id: combat
    attributes:
      label: Were you in combat?
      options: ["Yes", "No", "Not sure"]
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in your AddOns list.
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: If a Lua error appeared, paste the full text here. The error display (or an addon like BugSack) shows it.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, other addons you use, etc.
